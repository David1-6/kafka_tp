services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870"  # UI web HDFS
      - "9000:9000"  # Port HDFS principal (fs.defaultFS)
      - "50070:50070"  # Interface Web HDFS (optionnel, pour vérifier l'état de HDFS)
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=tp-big-data
    env_file:
      - ./hadoop.env
    networks:
      - big-data-network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop.env
    networks:
      - big-data-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - big-data-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"  # Port interne
      - "29092:29092"  # Port externe pour l'accès à Kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - big-data-network

  spark-master:
    image: bde2020/spark-master:3.1.1-hadoop3.2
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - INIT_DAEMON_STEP=setup_spark
    networks:
      - big-data-network

  spark-worker:
    image: bde2020/spark-worker:3.1.1-hadoop3.2
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    networks:
      - big-data-network

  spark-consumer:
    build:
      context: ./spark_consumer
    container_name: spark-consumer
    depends_on:
      - kafka
      - spark-master
    restart: on-failure
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPARK_MASTER=spark://spark-master:7077
    volumes:
      - /tmp:/tmp  # Pour partager le répertoire /tmp entre les containers, ce qui permet d'éviter les conflits de checkpoints.
    networks:
      - big-data-network

  python-consumer:
    build:
      context: ./python_consumer
    container_name: python-consumer
    depends_on:
      - kafka
    restart: on-failure
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - big-data-network

  python-producer:
    build:
      context: ./python_producer
    container_name: python-producer
    depends_on:
      - kafka
    restart: on-failure
    networks:
      - big-data-network

  flask-api:
    build:
      context: ./flask_api  # Le répertoire où se trouve le Dockerfile pour Flask
    container_name: flask-api
    ports:
      - "5000:5000"  # Port local 5000 pour accéder à l'API Flask
    depends_on:
      - namenode  # Assurez-vous que HDFS est déjà opérationnel
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    networks:
      - big-data-network

volumes:
  kafka_data:
  hadoop_datanode:
  hadoop_namenode:

networks:
  big-data-network:
    driver: bridge
